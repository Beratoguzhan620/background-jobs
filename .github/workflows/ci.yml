name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BackgroundJobs.slnx

      - name: Build
        run: dotnet build BackgroundJobs.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/BackgroundJobs.UnitTests/BackgroundJobs.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Integration tests (PostgreSQL in Testcontainers, in-process Hangfire servers)
        run: dotnet test tests/BackgroundJobs.IntegrationTests/BackgroundJobs.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Check for model changes without a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet ef migrations has-pending-model-changes --project src/BackgroundJobs.Infrastructure --startup-project src/BackgroundJobs.Api --no-build --configuration Release

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Check the API and the workers
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/health/ready | grep -q "Healthy"
          test "$(docker compose ps --status running --quiet worker | wc -l)" = "2"

          api=http://localhost:8080/api
          token=$(curl -sf -X POST $api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"admin-password-local"}' | jq -r .accessToken)
          curl -sf $api/jobs -H "Authorization: Bearer $token" | jq -e '.items | type == "array"' > /dev/null
          echo "API and two workers are up."

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  dashboard:
    name: Dashboard end-to-end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run the flow
        working-directory: tests/e2e
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then break; fi
            sleep 2
          done
          node dashboard.mjs

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
